description: >-
  First-party AnnounceKit client libraries. Two distinct families: the widget
  SDK wrappers (React, Vue, Angular, React Native, iOS, Flutter) which embed the
  in-app changelog widget, and announcekit-mcp, the Model Context Protocol
  server that wraps the GraphQL API for AI clients. The widget wrappers are the
  decay signal in this repo - every one of them last published in 2023-2025
  while the GraphQL API and the MCP server shipped in 2026.
