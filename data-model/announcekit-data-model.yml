source: >-
  Derived from the live introspected GraphQL schema at
  https://announcekit.app/gq/v2 (graphql/announcekit-schema.graphql, 179 types,
  2026-09-02). Relationships are read from typed object references and from
  *_id scalar fields; nothing here is inferred from prose.
provider: AnnounceKit
providerId: announcekit
description: >-
  The AnnounceKit entity graph. Project is the root of everything: it is the
  billing unit, the permission boundary and the foreign key on essentially every
  other entity. There is no account or organization type above it - a customer
  with three products buys three projects, which is exactly what the flat
  per-project pricing model implies.
root_entity: Project
identifier_convention:
  type: ID
  format: opaque numeric string
  note: >-
    Every id is the GraphQL ID scalar and is serialised as a numeric string
    (e.g. project id "2672", label id "5442" in the vendor's own tutorial).
    There are no typed or prefixed identifiers, so an id carries no information
    about what it identifies - a bare "5442" is only a label because of where it
    was read. Access tokens are the one exception and carry an ak_pat_ prefix.
custom_scalars: [Date, JSONObject]
scalar_note: >-
  JSONObject is used for eight distinct concerns (segment_filters, view_data,
  Widget.options, Widget.theme, Nps.options, filters, fields, user_filter). Its
  shape is invisible to introspection and undocumented, so those regions of the
  model are opaque to a generated client.
