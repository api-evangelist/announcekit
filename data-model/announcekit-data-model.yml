  - {type: belongs_to, target: ExternalUser, via: external_user_id}
  - {type: belongs_to, target: Issue, via: issue_id}
  - {type: has_many, target: FeatureRequestComment, via: comments}
  - {type: has_many, target: FeatureRequestVote, via: votes}
  - {type: has_many, target: FeatureRequestLabel, via: labels}
  - {type: has_many, target: FeatureRequestContent, via: contents}
  - {type: has_one, target: FeatureRequestStats, via: stats}
  note: >-
    The issue_id link is the hinge between the two halves of the product - it is
    how a request the users voted for becomes an item on the public roadmap.
