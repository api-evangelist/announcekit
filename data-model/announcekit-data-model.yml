  - {type: belongs_to, target: Locale, via: locale_id}
- name: FeatureRequest
  description: A user-submitted request with voting and commenting.
  key_fields: [id, project_id, title, summary, is_archived, is_internal, is_approved,
    is_voting_enabled, is_commenting_enabled]
  relationships:
