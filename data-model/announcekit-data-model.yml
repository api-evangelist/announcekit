- name: Post
  description: An announcement or release note. The central content object.
  key_fields: [id, project_id, created_at, visible_at, expire_at, is_draft, is_pinned,
    is_internal, is_pushed, status]
  relationships:
  - {type: belongs_to, target: Project, via: project_id}
  - {type: belongs_to, target: User, via: user_id}
  - {type: has_many, target: PostContent, via: contents}
  - {type: has_many, target: PostLabel, via: labels}
  - {type: has_many, target: KnowledgeBaseArticle, via: kb_articles}
  - {type: has_many, target: RelatedRoadmapItem, via: related_roadmap}
  - {type: has_many, target: RelatedFeatureRequest, via: related_feature_requests}
  - {type: has_one, target: Image, via: image_id}
  - {type: has_one, target: NpsStatScore, via: nps}
  - {type: has_one, target: Notification, via: notification}
  state_model:
    fields: [is_draft, visible_at, expire_at, is_paused, status]
    note: >-
      Post state is not an enum. It is computed from is_draft plus the
      visible_at / expire_at date pair, which is why the MCP server needs three
      separate tools (create_post, publish_post, schedule_post) that all call
      the same savePost mutation with different date and flag combinations.
- name: PostContent
  description: The localized body of a post. A post carries one content record per locale.
  key_fields: [locale_id, title, body]
  relationships:
