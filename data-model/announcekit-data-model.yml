  note: >-
    No secret field. There is nowhere in the model to store a signing key, which
    corroborates the absence of any documented webhook signature scheme.
localization:
  note: >-
    Localization is modelled as a first-class dimension rather than a field.
    Post, FeatureRequest and KnowledgeBaseArticle each hold a contents[] array
    of per-locale records with a defaultContent shortcut, and ProjectLocale
    declares which locales a project supports.
