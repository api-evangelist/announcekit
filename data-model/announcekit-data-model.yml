- name: Label
  description: A tag applied to posts, feature requests and roadmap items.
  relationships:
  - {type: belongs_to, target: Project, via: project_id}
  note: >-
    One Label type serves three surfaces; which surfaces it applies to is
    carried in the options JSONObject (applies_to_posts,
    applies_to_feature_requests, applies_to_roadmap in the MCP tool schema).
