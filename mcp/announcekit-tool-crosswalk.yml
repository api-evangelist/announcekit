generated: '2026-09-02'
method: derived
source: >-
  Derived by binding each tool in AnnounceKit's published announcekit-mcp 0.1.0
  package to the GraphQL root field its own request document names, checked
  against the live introspected schema at https://announcekit.app/gq/v2
  (graphql/announcekit-schema.graphql, introspected 2026-09-02).
provider: AnnounceKit
providerId: announcekit
description: >-
  AnnounceKit ships no OpenAPI, so this crosswalk binds MCP tools to GraphQL
  root fields rather than REST operationIds. Confidence is high throughout
  because the binding is not inferred from names - each tool file in the
  provider's own package embeds the GraphQL document it sends, and every named
  field resolves in the live schema.
surfaces:
  graphql:
    endpoint: https://announcekit.app/gq/v2
    schema: graphql/announcekit-schema.graphql
    gated: false
    note: >-
      Introspection is open and unauthenticated; executing most queries is not.
      93 Query fields, 150 Mutation fields.
  mcp:
    endpoint: https://mcp.announcekit.app/mcp
    manifest: mcp/announcekit-mcp.yml
    gated: true
    note: tools/list returns 401 without a Bearer token.
  openapi:
    present: false
    note: >-
      No OpenAPI or Swagger document is published. /openapi.json,
      /openapi.yaml, /swagger.json and /api-docs on announcekit.app all return
      404 (probed 2026-09-02). The GraphQL schema is the machine-readable
      contract.
