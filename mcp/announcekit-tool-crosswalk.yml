mcp_only: []
graphql_only_highlights:
  note: >-
    The MCP server exposes 29 tools against a GraphQL surface of 243 root fields
    (93 queries + 150 mutations). The unexposed remainder is not an oversight -
    it is the deliberate boundary the vendor documents. The largest excluded
    groups are listed here rather than enumerated one by one.
  groups:
  - name: destructive
    examples: [deletePost, deleteLabel, deleteFeatureRequest, deleteIssue, deleteStatus,
      deleteWidget, deleteProject, deleteAllPosts, deleteAllExternalUsers, deleteAllNps,
      removeExternalUser, deleteActivity]
    reason: Every delete is excluded from the MCP server by design; deletes stay dashboard-only.
  - name: billing-and-subscription
    examples: [beginPaddleSubscription, ensureSubscription, cancelSubscription, saveBillingInfo,
      invoices, plans, checkSubscriptionPlan, createCoupons]
    reason: Account and billing actions are intentionally left out of the agent surface.
  - name: identity-and-access
    examples: [login, logout, createUser, acceptInvite, createTotpConfig, saveSamlConfig,
      addProjectMember, updateProjectMemberRole, createAccessToken, revokeAccessToken,
      revokeConnectedApp]
    reason: Authentication, SSO, team membership and token lifecycle are dashboard-only.
  - name: widgets-and-configuration
    examples: [ensureWidget, saveWidget, saveWidgetTheme, saveFeed, verifyCname, saveEmailConfig,
      saveProjectRoadmapConfig, saveProjectWebhook, removeProjectWebhook]
    reason: >-
      Widget, feed, email and webhook configuration is a setup-time concern the
      server does not expose. Note this means webhooks cannot be managed by an
      agent even though they can be by the GraphQL API.
  - name: knowledge-base
    examples: [knowledgeBaseArticles, saveKnowledgeBaseArticle, generateKnowledgeBaseArticleSummary,
      importKnowledgeBaseFromIntercom, knowledgeBaseAnalytics]
    reason: >-
      The Knowledge Base entered beta on 2026-08-13, after announcekit-mcp 0.1.0
      shipped on 2026-07-01. It is in the schema but not yet in the tool set.
  - name: imports
    examples: [importHeadway, importBeamer, importGitHub, importNoticeable, importReleaseNotes,
      importExternalUsers]
    reason: Migration tooling, not runtime agent work.
